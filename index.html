<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weekly To-Do</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --ink: #1f1f1f;
    --muted: #a3a3a3;
    --line: #ececec;
    --rule: #1f1f1f;
    --accent: #ff5a4e;
    --hover: #f5f5f5;
    --done: #c4c4c4;
    --ph: rgba(255, 90, 78, .08);
    --lh: 28px;            /* height of one line */
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #191919; --ink: #e8e8e8; --muted: #6f6f6f; --line: #2a2a2a;
      --rule: #e8e8e8; --hover: #222; --done: #555; --ph: rgba(255, 90, 78, .12);
    }
  }
  :root[data-theme="dark"] {
    --bg: #191919; --ink: #e8e8e8; --muted: #6f6f6f; --line: #2a2a2a;
    --rule: #e8e8e8; --hover: #222; --done: #555; --ph: rgba(255, 90, 78, .12);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px; padding: 10px 14px 14px; -webkit-font-smoothing: antialiased;
  }
  body.dragging, body.dragging * { cursor: grabbing !important; user-select: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }

  /* Top bar */
  /* Controls stay on the left: Notion overlays its own buttons on an embed's top-right corner. */
  .top { display: flex; align-items: baseline; margin-bottom: 8px; gap: 14px; }
  .title { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
  .title span { color: var(--muted); font-weight: 500; }
  .top button { font-size: 11px; color: var(--muted); }
  .top button:hover { color: var(--ink); }

  /* 4 x 2 grid; boxes in a row share the tallest box's height */
  .week { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 16px; }
  @media (max-width: 640px) { .week { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 360px) { .week { grid-template-columns: minmax(0, 1fr); } }

  .day { display: flex; flex-direction: column; min-width: 0; }
  .day header {
    display: flex; align-items: baseline; justify-content: space-between;
    border-bottom: 2px solid var(--rule); padding-bottom: 3px;
  }
  .day .num { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
  .day .dow { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .day.today header { border-color: var(--accent); }
  .day.today .num, .day.today .dow { color: var(--accent); }
  .day.past .num { color: var(--muted); }
  .day.past .dow::after { content: " · overdue"; color: var(--accent); }

  /* Lined paper: lines are drawn by the background, so empty space below tasks is still ruled */
  ul {
    list-style: none; margin: 0; padding: 0; flex: 1; cursor: text;
    background-image: linear-gradient(to bottom, transparent calc(var(--lh) - 1px), var(--line) calc(var(--lh) - 1px));
    background-size: 100% var(--lh);
  }
  li { height: var(--lh); display: flex; align-items: center; gap: 6px; position: relative; }
  li.task { cursor: grab; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  li.task .text {
    flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 3px;
  }
  li.task.done .text { color: var(--done); text-decoration: line-through; }
  li.task .check {
    width: 15px; height: 15px; margin-right: 3px; border-radius: 50%; border: 1.5px solid var(--muted);
    flex: none; opacity: 0; transition: opacity .12s; display: grid; place-items: center; cursor: pointer;
  }
  li.task:hover .check, li.task.done .check { opacity: 1; }
  li.task.done .check { background: var(--done); border-color: var(--done); }
  li.task.done .check::after {
    content: ""; width: 4px; height: 7px; border: solid var(--bg); border-width: 0 1.5px 1.5px 0;
    transform: translateY(-1px) rotate(45deg);
  }
  @media (hover: none) { li.task .check { opacity: .6; } }

  li.placeholder { background: var(--ph); border-radius: 4px; height: calc(var(--lh) - 1px); margin-bottom: 1px; }
  li.ghost {
    position: fixed; z-index: 10; pointer-events: none; margin: 0; border-radius: 4px;
    background: var(--bg); box-shadow: 0 6px 20px rgba(0, 0, 0, .18), 0 0 0 1px var(--line);
    transform: rotate(-1.5deg);
  }
  li.ghost .check { opacity: 0; }

  li input {
    width: 100%; border: 0; outline: 0; background: transparent; color: var(--ink);
    font: inherit; padding: 0 3px; height: 100%;
  }
</style>
</head>
<body>
  <div class="top">
    <h1 class="title" id="title"></h1>
    <button id="clearDone" title="Delete completed tasks">Clear completed</button>
  </div>

  <div class="week" id="week"></div>

<script>
(() => {
  const KEY = 'weekly-todo-v1';
  const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DAYS = 7;       // day boxes shown (plus one "Someday" box = 4x2 grid)
  const LINES = 4;      // default lines per box; boxes grow as they fill
  const SOMEDAY = 'someday';
  const isDay = key => /^\d{4}-\d{2}-\d{2}$/.test(key);
  const lineHeight = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--lh')) || 28;

  let data = migrate(load());
  let shownToday = iso(new Date());
  let editing = null;   // { key, id }  id === null means a new task at the end
  let press = null;     // pointer press on a task; becomes a drag once it moves

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; }
  }
  function save() {
    for (const k of Object.keys(data)) if (!data[k].length) delete data[k];
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {}
  }
  const uid = () => Math.random().toString(36).slice(2, 10);

  // Earlier version had three someday lists; fold them into one.
  function migrate(d) {
    for (const k of ['someday-1', 'someday-2', 'someday-3']) {
      if (d[k]) { (d[SOMEDAY] ||= []).push(...d[k]); delete d[k]; }
    }
    return d;
  }

  function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
  function iso(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }
  const list = key => (data[key] ||= []);

  // ---------- rendering ----------
  // Past days only appear while they still have unfinished tasks, oldest first.
  // After them come today and the following days, up to DAYS boxes in total.
  function visibleDays() {
    const today = new Date();
    const todayKey = iso(today);
    const past = Object.keys(data)
      .filter(k => isDay(k) && k < todayKey && data[k].some(t => !t.done))
      .sort();
    const days = past.map(k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); });
    for (let i = 0; days.length < DAYS || i === 0; i++) days.push(addDays(today, i));
    return days;
  }

  function render() {
    const todayKey = iso(new Date());
    shownToday = todayKey;
    const days = visibleDays();

    const first = days[0], last = days[days.length - 1];
    const m1 = MONTHS[first.getMonth()], m2 = MONTHS[last.getMonth()];
    document.getElementById('title').innerHTML = m1 === m2
      ? `${m1} <span>${last.getFullYear()}</span>`
      : `${m1.slice(0, 3)} – ${m2.slice(0, 3)} <span>${last.getFullYear()}</span>`;

    const week = document.getElementById('week');
    week.innerHTML = '';
    for (const d of days) {
      const key = iso(d);
      const cls = key === todayKey ? 'today' : key < todayKey ? 'past' : '';
      week.appendChild(column(key, d.getDate(), DOW[d.getDay()], cls));
    }
    week.appendChild(column(SOMEDAY, 'Someday', '', 'someday'));

    const input = document.querySelector('li input');
    if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
  }

  function column(key, num, dow, cls) {
    const sec = document.createElement('section');
    sec.className = `day ${cls}`;
    sec.dataset.key = key;
    sec.innerHTML = `<header><span class="num">${num}</span><span class="dow">${dow}</span></header>`;

    const ul = document.createElement('ul');
    const tasks = list(key);
    for (const t of tasks) {
      const li = document.createElement('li');
      li.dataset.id = t.id;
      if (editing && editing.key === key && editing.id === t.id) {
        li.appendChild(makeInput(key, t.id, t.text));
      } else {
        li.className = 'task' + (t.done ? ' done' : '');
        const span = document.createElement('span');
        span.className = 'text';
        span.textContent = t.text;
        const check = document.createElement('button');
        check.className = 'check';
        check.setAttribute('aria-label', t.done ? 'Mark not done' : 'Mark done');
        check.addEventListener('mousedown', e => e.preventDefault()); // keep an open edit from re-rendering first
        check.addEventListener('click', e => {
          e.stopPropagation();
          document.querySelector('li input')?.blur();
          t.done = !t.done; save(); render();
        });
        li.append(span, check);
        li.addEventListener('pointerdown', e => onPress(e, key, t.id, li));
      }
      ul.appendChild(li);
    }
    const isNew = editing && editing.key === key && editing.id === null;
    if (isNew) {
      const li = document.createElement('li');
      li.appendChild(makeInput(key, null, ''));
      ul.appendChild(li);
    }
    // Always leave an empty line to click into, and never fewer than LINES.
    ul.style.minHeight = `${Math.max(LINES, tasks.length + 1) * lineHeight()}px`;

    // While a line is open for typing, keep its blur from re-rendering under the pointer.
    // Pressing a task is left to the drag code (drag it, or edit it on release);
    // pressing empty space switches to a new line right away.
    ul.addEventListener('mousedown', e => {
      if (e.button !== 0 || e.target.closest('input, .check')) return;
      if (!document.querySelector('li input')) return;
      e.preventDefault();
      if (!e.target.closest('li.task')) startEdit(key, null);
    });
    ul.addEventListener('click', e => {
      if (e.target.closest('input, .check, li.task')) return;
      startEdit(key, null);
    });

    sec.appendChild(ul);
    return sec;
  }

  // ---------- drag & drop (pointer based; mouse drags right away, touch after a short hold) ----------
  function onPress(e, key, id, li) {
    if (e.button !== 0 || e.target.closest('.check')) return;
    press = { key, id, li, x: e.clientX, y: e.clientY, touch: e.pointerType !== 'mouse', started: false, timer: 0 };
    if (press.touch) press.timer = setTimeout(() => press && beginDrag(press.x, press.y), 250);
  }

  document.addEventListener('pointermove', e => {
    if (!press) return;
    // Button was released somewhere we didn't hear about (e.g. outside the Notion embed): drop here.
    if (press.started && !press.touch && e.buttons === 0) { moveDrag(e.clientX, e.clientY); return endDrag(); }
    if (!press.started) {
      const dist = Math.hypot(e.clientX - press.x, e.clientY - press.y);
      if (!press.touch && dist > 4) beginDrag(e.clientX, e.clientY);
      else if (press.touch && dist > 8) { clearTimeout(press.timer); press = null; } // they're scrolling
      return;
    }
    moveDrag(e.clientX, e.clientY);
  });

  document.addEventListener('pointerup', () => {
    if (!press) return;
    clearTimeout(press.timer);
    const p = press;
    if (p.started) return endDrag();
    press = null;
    startEdit(p.key, p.id);
  });

  // Leaving the embed mid-drag: finish the drop where the pointer last was.
  document.documentElement.addEventListener('pointerleave', e => {
    if (press && press.started && !press.touch && e.buttons === 0) endDrag();
  });
  window.addEventListener('blur', () => { if (press && press.started) endDrag(); });

  document.addEventListener('pointercancel', () => {
    if (!press) return;
    clearTimeout(press.timer);
    if (press.started) cancelDrag(); else press = null;
  });

  // Once a touch drag has started, stop the page from scrolling underneath it.
  document.addEventListener('touchmove', e => { if (press && press.started) e.preventDefault(); }, { passive: false });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && press && press.started) cancelDrag(); });

  function beginDrag(x, y) {
    // Close any line that's open for typing first; that re-renders, so find the task again.
    const active = document.querySelector('li input');
    if (active) {
      active.blur();
      press.li = document.querySelector(`.day[data-key="${press.key}"] li.task[data-id="${press.id}"]`);
    }
    const { li } = press;
    if (!li || !li.isConnected) { press = null; return; }
    press.started = true;
    const r = li.getBoundingClientRect();
    press.dx = x - r.left;
    press.dy = y - r.top;

    // Freeze box heights so nothing jumps while the task is lifted out.
    document.querySelectorAll('.day ul').forEach(u => { u.style.minHeight = `${u.offsetHeight}px`; });

    const ghost = li.cloneNode(true);
    ghost.classList.add('ghost');
    Object.assign(ghost.style, { left: `${r.left}px`, top: `${r.top}px`, width: `${r.width}px` });
    document.body.appendChild(ghost);
    press.ghost = ghost;

    li.className = 'placeholder';
    li.replaceChildren();
    document.body.classList.add('dragging');
    navigator.vibrate?.(10);
    moveDrag(x, y);
  }

  function moveDrag(x, y) {
    const { ghost, li: ph } = press;
    ghost.style.left = `${x - press.dx}px`;
    ghost.style.top = `${y - press.dy}px`;

    const ul = document.elementFromPoint(x, y)?.closest('.day')?.querySelector('ul');
    if (!ul) return;
    let before = null;
    for (const t of ul.querySelectorAll('li.task')) {
      const r = t.getBoundingClientRect();
      if (y < r.top + r.height / 2) { before = t; break; }
    }
    if (before) { if (ph.nextElementSibling !== before) ul.insertBefore(ph, before); }
    else if (ph.parentNode !== ul || ph.nextElementSibling) ul.appendChild(ph);
  }

  function endDrag() {
    const { key, id, li: ph, ghost } = press;
    press = null;
    ghost.remove();
    document.body.classList.remove('dragging');

    const toKey = ph.closest('.day').dataset.key;
    let index = 0;
    for (let n = ph.previousElementSibling; n; n = n.previousElementSibling) if (n.classList.contains('task')) index++;

    const from = list(key);
    const i = from.findIndex(t => t.id === id);
    if (i >= 0) {
      const [task] = from.splice(i, 1);
      list(toKey).splice(index, 0, task);
      save();
    }
    render();
  }

  function cancelDrag() {
    press.ghost.remove();
    press = null;
    document.body.classList.remove('dragging');
    render();
  }

  // ---------- editing ----------
  function makeInput(key, id, value) {
    const input = document.createElement('input');
    input.value = value;
    let finished = false;
    const finish = next => {
      if (finished) return;
      finished = true;
      commit(key, id, input.value);
      editing = next;
      render();
    };
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        // keep typing: open a fresh line after committing (only if something was typed)
        finish(input.value.trim() ? { key, id: null } : null);
      } else if (e.key === 'Escape') {
        finished = true; editing = null; render();
      }
    });
    input.addEventListener('blur', () => finish(null));
    return input;
  }

  function startEdit(key, id) {
    const active = document.querySelector('li input');
    if (active) active.blur(); // commits the current edit first
    editing = { key, id };
    render();
  }

  function commit(key, id, raw) {
    const text = raw.trim();
    const tasks = list(key);
    if (id === null) {
      if (text) tasks.push({ id: uid(), text, done: false });
    } else {
      const i = tasks.findIndex(t => t.id === id);
      if (i < 0) return;
      if (text) tasks[i].text = text; else tasks.splice(i, 1);
    }
    save();
  }

  // ---------- controls ----------
  document.getElementById('clearDone').onclick = () => {
    for (const key of Object.keys(data)) data[key] = data[key].filter(t => !t.done);
    save(); render();
  };

  // Roll forward at midnight, and whenever the page comes back into view on a new day.
  function scheduleMidnight() {
    const now = new Date();
    const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 5);
    setTimeout(() => { if (!editing && !press) render(); scheduleMidnight(); }, next - now);
  }
  scheduleMidnight();
  const refreshIfNewDay = () => { if (!editing && !press && iso(new Date()) !== shownToday) render(); };
  document.addEventListener('visibilitychange', refreshIfNewDay);
  window.addEventListener('focus', refreshIfNewDay);

  // keep in sync if the widget is open in two places (e.g. two Notion pages)
  window.addEventListener('storage', e => { if (e.key === KEY && !editing && !press) { data = load(); render(); } });

  render();
})();
</script>
</body>
</html>
