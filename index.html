<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weekly To-Do</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --ink: #1f1f1f;
    --muted: #a3a3a3;
    --line: #ededed;
    --rule: #1f1f1f;
    --accent: #ff5a4e;
    --hover: #f7f7f7;
    --done: #c4c4c4;
    --drop: #ff5a4e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #191919; --ink: #e8e8e8; --muted: #6f6f6f; --line: #2a2a2a;
      --rule: #e8e8e8; --hover: #222; --done: #555;
    }
  }
  :root[data-theme="dark"] {
    --bg: #191919; --ink: #e8e8e8; --muted: #6f6f6f; --line: #2a2a2a;
    --rule: #e8e8e8; --hover: #222; --done: #555;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px; padding: 20px 16px 28px; -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }

  /* Top bar */
  .top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; gap: 12px; }
  .title { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
  .title span { color: var(--muted); font-weight: 500; }
  .nav { display: flex; align-items: center; gap: 4px; }
  .nav button { height: 28px; min-width: 28px; padding: 0 8px; border-radius: 6px; color: var(--muted); font-weight: 500; }
  .nav button:hover { background: var(--hover); color: var(--ink); }
  .nav .arrow { font-size: 18px; line-height: 1; }

  /* Grid */
  .week { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 30px 18px; }

  @media (max-width: 700px) {
    .week { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 18px; }
  }
  @media (max-width: 420px) {
    .week { grid-template-columns: minmax(0, 1fr); }
    .title { font-size: 22px; }
  }

  /* Day column */
  .day header {
    display: flex; align-items: baseline; justify-content: space-between;
    border-bottom: 2px solid var(--rule); padding-bottom: 6px;
  }
  .day .num { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .day .dow { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .day.today header { border-color: var(--accent); }
  .day.today .num, .day.today .dow { color: var(--accent); }
  .day.past .num { color: var(--muted); }
  .day.past .dow::after { content: " · overdue"; color: var(--accent); }
  .day.someday .num { font-size: 20px; }

  ul { list-style: none; margin: 0; padding: 0; }
  li {
    height: 33px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 6px; position: relative;
  }
  li.blank { cursor: text; }
  li.task { cursor: text; }
  li.task .text {
    flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    padding: 0 2px;
  }
  li.task.done .text { color: var(--done); text-decoration: line-through; }
  li.task .check {
    width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--muted);
    flex: none; opacity: 0; transition: opacity .12s;
    display: grid; place-items: center;
  }
  li.task:hover .check, li.task.done .check { opacity: 1; }
  li.task.done .check { background: var(--done); border-color: var(--done); }
  li.task.done .check::after { content: ""; width: 5px; height: 8px; border: solid var(--bg); border-width: 0 1.5px 1.5px 0; transform: translateY(-1px) rotate(45deg); }
  @media (hover: none) { li.task .check { opacity: .6; } }
  li.task.dragging { opacity: .35; }
  li.drop-before::before {
    content: ""; position: absolute; left: 0; right: 0; top: -1px; height: 2px; background: var(--drop);
  }

  li input {
    width: 100%; border: 0; outline: 0; background: transparent; color: var(--ink);
    font: inherit; padding: 0 2px; height: 100%;
  }

  .foot { margin-top: 26px; display: flex; justify-content: flex-end; gap: 14px; }
  .foot button { font-size: 12px; color: var(--muted); }
  .foot button:hover { color: var(--ink); }
</style>
</head>
<body>
  <div class="top">
    <h1 class="title" id="title"></h1>
  </div>

  <div class="week" id="week"></div>

  <div class="foot">
    <button id="clearDone" title="Delete completed tasks">Clear completed</button>
  </div>

<script>
(() => {
  const KEY = 'weekly-todo-v1';
  const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const DAYS = 7;       // day boxes shown (plus one "Someday" box = 4x2 grid)
  const LINES = 8;      // minimum lines per box
  const SOMEDAY = 'someday';
  const isDay = key => /^\d{4}-\d{2}-\d{2}$/.test(key);
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  let data = migrate(load());
  let shownToday = iso(new Date());
  let editing = null;   // { key, id }  id === null means a new task at the end
  let drag = null;      // { key, id }

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {}
  }
  const uid = () => Math.random().toString(36).slice(2, 10);

  // Earlier version had three someday lists; fold them into one.
  function migrate(d) {
    for (const k of ['someday-1', 'someday-2', 'someday-3']) {
      if (d[k]) { (d[SOMEDAY] ||= []).push(...d[k]); delete d[k]; }
    }
    return d;
  }
  function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
  function iso(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }
  const list = key => (data[key] ||= []);

  // ---------- rendering ----------
  // Past days only appear while they still have unfinished tasks, oldest first.
  // After them come today and the following days, up to DAYS boxes in total.
  function visibleDays() {
    const today = new Date();
    const todayKey = iso(today);
    const past = Object.keys(data)
      .filter(k => isDay(k) && k < todayKey && data[k].some(t => !t.done))
      .sort();
    const days = past.map(k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); });
    for (let i = 0; days.length < DAYS || i === 0; i++) days.push(addDays(today, i));
    return days;
  }

  function render() {
    const todayKey = iso(new Date());
    shownToday = todayKey;
    const days = visibleDays();

    const first = days[0], last = days[days.length - 1];
    const m1 = MONTHS[first.getMonth()], m2 = MONTHS[last.getMonth()];
    document.getElementById('title').innerHTML = m1 === m2
      ? `${m1} <span>${last.getFullYear()}</span>`
      : `${m1.slice(0, 3)} – ${m2.slice(0, 3)} <span>${last.getFullYear()}</span>`;

    const week = document.getElementById('week');
    week.innerHTML = '';
    for (const d of days) {
      const key = iso(d);
      const cls = key === todayKey ? 'today' : key < todayKey ? 'past' : '';
      week.appendChild(column(key, d.getDate(), DOW[d.getDay()], LINES, cls));
    }
    week.appendChild(column(SOMEDAY, 'Someday', '', LINES, 'someday'));

    const input = document.querySelector('li input');
    if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
  }

  function column(key, num, dow, minLines, cls) {
    const sec = document.createElement('section');
    sec.className = `day ${cls}`;
    sec.dataset.key = key;
    sec.innerHTML = `<header><span class="num">${num}</span><span class="dow">${dow}</span></header>`;
    const ul = document.createElement('ul');
    const tasks = list(key);

    tasks.forEach(t => {
      const li = document.createElement('li');
      li.dataset.id = t.id;
      if (editing && editing.key === key && editing.id === t.id) {
        li.appendChild(makeInput(key, t.id, t.text));
      } else {
        li.className = 'task' + (t.done ? ' done' : '');
        li.draggable = true;
        const span = document.createElement('span');
        span.className = 'text';
        span.textContent = t.text;
        const check = document.createElement('button');
        check.className = 'check';
        check.setAttribute('aria-label', t.done ? 'Mark not done' : 'Mark done');
        check.addEventListener('click', e => { e.stopPropagation(); t.done = !t.done; save(); render(); });
        li.append(span, check);
        bindEdit(li, key, t.id);
        li.addEventListener('dragstart', e => {
          drag = { key, id: t.id };
          li.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', t.text);
        });
        li.addEventListener('dragend', () => { drag = null; clearDropMarks(); render(); });
      }
      ul.appendChild(li);
    });

    const isNew = editing && editing.key === key && editing.id === null;
    if (isNew) {
      const li = document.createElement('li');
      li.appendChild(makeInput(key, null, ''));
      ul.appendChild(li);
    }
    const blanks = Math.max(1, minLines - tasks.length - (isNew ? 1 : 0));
    for (let b = 0; b < blanks; b++) {
      const li = document.createElement('li');
      li.className = 'blank';
      bindEdit(li, key, null);
      ul.appendChild(li);
    }

    // drag & drop target
    ul.addEventListener('dragover', e => {
      if (!drag) return;
      e.preventDefault();
      clearDropMarks();
      const target = dropTarget(ul, e.clientY);
      (target || ul.querySelector('li.blank'))?.classList.add('drop-before');
    });
    ul.addEventListener('dragleave', e => { if (!ul.contains(e.relatedTarget)) clearDropMarks(); });
    ul.addEventListener('drop', e => {
      if (!drag) return;
      e.preventDefault();
      const target = dropTarget(ul, e.clientY);
      const from = list(drag.key);
      const idx = from.findIndex(t => t.id === drag.id);
      if (idx < 0) return;
      const [task] = from.splice(idx, 1);
      const to = list(key);
      let at = target ? to.findIndex(t => t.id === target.dataset.id) : to.length;
      if (at < 0) at = to.length;
      to.splice(at, 0, task);
      drag = null;
      save(); render();
    });

    sec.appendChild(ul);
    return sec;
  }

  function dropTarget(ul, y) {
    for (const li of ul.querySelectorAll('li.task:not(.dragging)')) {
      const r = li.getBoundingClientRect();
      if (y < r.top + r.height / 2) return li;
    }
    return null;
  }
  function clearDropMarks() {
    document.querySelectorAll('.drop-before').forEach(el => el.classList.remove('drop-before'));
  }

  // ---------- editing ----------
  function makeInput(key, id, value) {
    const input = document.createElement('input');
    input.value = value;
    let finished = false;
    const finish = (next) => {
      if (finished) return;
      finished = true;
      commit(key, id, input.value);
      editing = next;
      render();
    };
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        // keep typing: open a fresh line after committing (only if something was typed)
        finish(input.value.trim() ? { key, id: null } : null);
      } else if (e.key === 'Escape') {
        finished = true; editing = null; render();
      }
    });
    input.addEventListener('blur', () => finish(null));
    return input;
  }

  // If another line is being edited, its blur re-renders before "click" fires,
  // so switch lines on mousedown instead.
  function bindEdit(li, key, id) {
    li.addEventListener('mousedown', e => {
      if (e.button !== 0 || e.target.closest('.check')) return;
      if (document.querySelector('li input')) { e.preventDefault(); startEdit(key, id); }
    });
    li.addEventListener('click', () => startEdit(key, id));
  }

  function startEdit(key, id) {
    const active = document.querySelector('li input');
    if (active) active.blur(); // commits the current edit first
    editing = { key, id };
    render();
  }

  function commit(key, id, raw) {
    const text = raw.trim();
    const tasks = list(key);
    if (id === null) {
      if (text) tasks.push({ id: uid(), text, done: false });
    } else {
      const i = tasks.findIndex(t => t.id === id);
      if (i < 0) return;
      if (text) tasks[i].text = text; else tasks.splice(i, 1);
    }
    if (!tasks.length) delete data[key];
    save();
  }

  // ---------- controls ----------
  document.getElementById('clearDone').onclick = () => {
    for (const key of Object.keys(data)) {
      data[key] = data[key].filter(t => !t.done);
      if (!data[key].length) delete data[key];
    }
    save(); render();
  };

  // Roll forward at midnight, and whenever the page comes back into view on a new day.
  function scheduleMidnight() {
    const now = new Date();
    const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 5);
    setTimeout(() => { if (!editing) render(); scheduleMidnight(); }, next - now);
  }
  scheduleMidnight();
  const refreshIfNewDay = () => { if (!editing && iso(new Date()) !== shownToday) render(); };
  document.addEventListener('visibilitychange', refreshIfNewDay);
  window.addEventListener('focus', refreshIfNewDay);

  // keep in sync if the widget is open in two places (e.g. two Notion pages)
  window.addEventListener('storage', e => { if (e.key === KEY) { data = load(); render(); } });

  render();
})();
</script>
</body>
</html>
